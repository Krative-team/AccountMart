<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlugMarket - Buy Verified Social Accounts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
  body{background:#0f0f12;color:#fff;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 20px}
  .logo{font-size:24px;font-weight:800}.logo span{color:#00e676}
  .btn{background:#00e676;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;border:0;cursor:pointer}
  .filters{max-width:1100px;margin:0 auto 20px;display:flex;gap:10px;flex-wrap:wrap}
  .filters input,.filters select{background:#1c1c22;color:#fff;border:1px solid #333;padding:11px 14px;border-radius:999px;outline:none}
  .filters input{flex:1;min-width:200px}
  .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:#1c1c22;border:1px solid #2a2a33;border-radius:16px;overflow:hidden;cursor:pointer}
  .card-top{height:130px;background:linear-gradient(135deg,#6a11cb,#2575fc);display:flex;align-items:center;justify-content:center;font-size:48px}
  .card-body{padding:16px}
  .badge{display:inline-block;background:#00e67622;color:#00e676;font-size:11px;padding:4px 8px;border-radius:999px;font-weight:700;margin-bottom:8px}
  .card-body h3{font-size:16px;line-height:1.3;margin-bottom:6px}
  .meta{color:#aaa;font-size:13px;margin-bottom:12px}
  .price{display:flex;justify-content:space-between;align-items:center}
  .price b{font-size:18px}.price span{color:#aaa;font-size:12px}
  #loading{text-align:center;color:#aaa;padding:40px}
</style>
</head>
<body>

<header>
  <div class="logo">Plug<span>Market</span></div>
  <button class="btn" onclick="alert('Seller page coming next')">+ Become a Seller</button>
</header>

<div class="filters">
  <input id="search" placeholder="Search TikTok, Instagram..." oninput="render()">
  <select id="platform" onchange="render()">
    <option value="">All Platforms</option>
    <option>TikTok</option><option>Instagram</option><option>Facebook</option><option>YouTube</option>
  </select>
  <select id="country" onchange="render()">
    <option value="">All Countries</option>
    <option>United States</option><option>Canada</option><option>United Kingdom</option>
  </select>
</div>

<div id="loading">Loading listings...</div>
<div class="grid" id="grid"></div>

<script>
  // === YOUR PROJECT - URL + KEY DON SET ===
  const SUPABASE_URL = "https://pfrpgijjqajwuhyfcdgw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XCDG8j8Te4UHw_qw8yOnJA_hThHuRdT";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let listings = [];
  const icons = { TikTok: "🎵", Instagram: "📸", Facebook: "👍", YouTube: "▶️" };

  async function load() {
    const { data, error } = await supabase
      .from('market_listings')
      .select('*')
      .eq('status', 'live')
      .order('created_at', { ascending: false });

    if (error) { document.getElementById('loading').innerText = "Error: " + error.message; return; }
    listings = data || [];
    document.getElementById('loading').style.display = 'none';
    render();
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const pf = document.getElementById('platform').value;
    const cf = document.getElementById('country').value;

    const filtered = listings.filter(l =>
      (!q || (l.title + l.platform + l.country).toLowerCase().includes(q)) &&
      (!pf || l.platform === pf) &&
      (!cf || l.country === cf)
    );

    document.getElementById('grid').innerHTML = filtered.map(l => `
      <div class="card" onclick="alert('${l.title} - Detail page coming next')">
        <div class="card-top">${icons[l.platform] || '🌐'}</div>
        <div class="card-body">
          <span class="badge">✓ VERIFIED</span>
          <h3>${l.title}</h3>
          <div class="meta">${l.platform} • ${l.country} • ${l.followers?.toLocaleString()} followers • ${l.account_age || ''}</div>
          <div class="price"><div><b>₦${l.price_naira?.toLocaleString()}</b><br><span>$${l.price_usdt} USDT</span></div><button class="btn">View</button></div>
        </div>
      </div>
    `).join('') || '<p style="color:#aaa">No listings found</p>';
  }

  load();
</script>
</body>
</html>
